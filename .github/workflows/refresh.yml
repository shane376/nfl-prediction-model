name: Refresh pregame predictions
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-prediction-artifacts
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_BRANCH: automation/nfl-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Continue durable history, then integrate reviewed code
        run: |
          cp scripts/integrate_refresh_branch.py "$RUNNER_TEMP/integrate_refresh_branch.py"
          cp scripts/refresh_validation.py "$RUNNER_TEMP/refresh_validation.py"
          REVIEWED_SHA=$(git rev-parse HEAD)
          echo "REVIEWED_SHA=$REVIEWED_SHA" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet "refs/remotes/origin/$DATA_BRANCH"; then
            git switch -c "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git switch -c "$DATA_BRANCH"
          fi
          HISTORY_BASE=$(git rev-parse HEAD)
          echo "HISTORY_BASE=$HISTORY_BASE" >> "$GITHUB_ENV"
          python "$RUNNER_TEMP/integrate_refresh_branch.py" "$REVIEWED_SHA" --strict
          python "$RUNNER_TEMP/refresh_validation.py" guard --reviewed "$REVIEWED_SHA" --history "$HISTORY_BASE"
          echo "ARTIFACT_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: python -m pytest -q
      - run: python -m src.pipeline refresh
      - name: Require reviewed model; never train implicitly
        run: |
          test -f artifacts/model.joblib
          test -f artifacts/retrospective/model.joblib
      - run: python -m src.pipeline predict --season 2026
      - run: python -m src.pipeline backtest --offline
      - run: python -m src.pipeline evaluate --offline
      - name: Validate generated state and suppress execution-only churn
        run: |
          python -m scripts.refresh_validation finalize --reviewed "$REVIEWED_SHA" --history "$HISTORY_BASE" --base "$ARTIFACT_BASE" --receipt "$RUNNER_TEMP/refresh-validation.json"
      - name: Commit the validated artifact state
        run: |
          python scripts/check_prediction_history.py "$HISTORY_BASE"
          git add artifacts
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh schedule and preserve pregame records"
          fi
      - name: Publish validated production snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.publish_refresh --receipt "$RUNNER_TEMP/refresh-validation.json" --branch "$DATA_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-pipeline-artifacts
          path: artifacts/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-validation-receipt
          path: ${{ runner.temp }}/refresh-validation.json
          if-no-files-found: ignore
          retention-days: 90
