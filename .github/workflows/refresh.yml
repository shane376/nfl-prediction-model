name: Refresh pregame predictions
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-prediction-artifacts
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2026-dashboard-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline refresh
      - name: Train only when no saved model exists
        run: |
          if [ ! -f artifacts/model.joblib ]; then python -m src.pipeline train; fi
      - run: python -m src.pipeline predict --season 2026
      - run: python -m src.pipeline evaluate
      - name: Persist successful artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh schedule and preserve pregame records"
            git push origin HEAD:feature/2026-dashboard-mvp
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-pipeline-artifacts
          path: artifacts/
          retention-days: 30
